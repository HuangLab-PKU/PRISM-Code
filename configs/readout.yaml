# Readout pipeline config (RUN_ID is passed via command line)

# Base directory for processed data; output goes to BASE_DIR / "{RUN_ID}_processed".
# Override on the command line with --base-dir.
base_dir: "/path/to/processed"

# Input channels.  `file` is the stitched image under the stitched dir, named by
# upstream acquisition; `name` is the column label PRISM emits and the key the
# gene-calling stage looks up in channel_correction.channels.
# Name convention: r{round:02d}_ex{excitation_wavelength_nm}
#   r01   = imaging round 1 (single-round for PRISM, multi-round ready)
#   ex628 = excitation center wavelength in nm
# Omitting `name` falls back to the file stem.
channels:
  - {file: cyc_1_cy5.tif,   name: r01_ex628}  # Cy5,   ex 628nm (bw40), em ~670nm
  - {file: cyc_1_TxRed.tif, name: r01_ex586}  # TxRed, ex 586nm (bw20), em ~615nm
  - {file: cyc_1_cy3.tif,   name: r01_ex531}  # Cy3,   ex 531nm (bw40), em ~550nm
  - {file: cyc_1_FAM.tif,   name: r01_ex485}  # FAM,   ex 485nm (bw20), em ~520nm

# Spot detection
detection_method: spotiflow  # spotiflow, gaussian_tophat, tophat
detection_prob_thresh:  # spotiflow probability threshold; null uses the model default
device:  # torch device for spotiflow; null auto-selects cuda when available
detection_snr:  # per-channel SNR for traditional methods (key = channel name)
  r01_ex628: 3.0
  r01_ex586: 3.0
  r01_ex531: 3.0
  r01_ex485: 3.0

# Intensity reading (tophat + local max)
tophat_radius: 3
search_radius: 1  # 3x3 max

# Deduplication
dedup_threshold: 2  # pixels

# Block processing
block_size: [2048, 2048]
block_overlap: [64, 64]

# Parallel workers (detection: 1 when spotiflow to avoid multi-load; intensity uses this)
n_workers: 4
